<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180"><rect width="1440" height="1180" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#233442}.title{font-size:20px;font-weight:700}.level{font-size:13px;fill:#667582}.label{font-size:12px;letter-spacing:1px;fill:#6D7F8B}.caption{font-size:15px}</style><text x="28" y="41" font-size="28" font-weight="700">Six local editing tasks</text><text x="28" y="72" font-size="16" fill="#647786">Original task designs · 256 × 256 canvas · Input and target shown at the same scale</text><text x="1410" y="41" text-anchor="end" font-size="14" fill="#A56532">DESIGN ONLY — NOT MODEL OUTPUTS</text><g transform="translate(0 110)"><text x="24" y="25" class="title">T01  Extend an arrow tip</text><text x="686" y="25" text-anchor="end" class="level">Medium-low</text><text x="121" y="59" text-anchor="middle" class="label">INPUT</text><text x="345" y="59" text-anchor="middle" class="label">TARGET</text><text x="569" y="59" text-anchor="middle" class="label">EDIT REGION</text><g transform="translate(26 74) scale(.74)"><path d="M35 109 L145 109 L145 78 L216 128 L145 178 L145 147 L35 147 Z" fill="#5C6973"/></g><g transform="translate(250 74) scale(.74)"><path d="M35 109 L145 109 L145 78 L236 128 L145 178 L145 147 L35 147 Z" fill="#357CA6"/></g><g transform="translate(474 74) scale(.74)"><path d="M35 109 L145 109 L145 78 L216 128 L145 178 L145 147 L35 147 Z" fill="none" stroke="#9EA7AF" stroke-width="2" stroke-dasharray="5 4"/><path d="M35 109 L145 109 L145 78 L236 128 L145 178 L145 147 L35 147 Z" fill="none" stroke="#357CA6" stroke-width="2"/><path d="M145 78 L236 128 L145 178" fill="none" stroke="#D18A48" stroke-width="4"/></g><text x="24" y="286" class="caption">Move the tip 20 px right. Keep the shoulders and shaft fixed.</text><line x1="24" x2="686" y1="332" y2="332" stroke="#E1E6E9"/></g><g transform="translate(720 110)"><text x="24" y="25" class="title">T02  Tilt a droplet tip</text><